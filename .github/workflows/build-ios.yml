name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios-simulator:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build webapp
        run: npm run build

      - name: Add iOS platform (if not exists)
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Configure iOS Info.plist permissions
        run: |
          PLIST="ios/App/App/Info.plist"
          # Add NSCameraUsageDescription
          plutil -insert NSCameraUsageDescription -string "vlocker needs camera access to take photos of your locker items and bills." "$PLIST" || \
            plutil -replace NSCameraUsageDescription -string "vlocker needs camera access to take photos of your locker items and bills." "$PLIST"
          # Add NSPhotoLibraryUsageDescription
          plutil -insert NSPhotoLibraryUsageDescription -string "vlocker needs photo library access to select images for your locker items." "$PLIST" || \
            plutil -replace NSPhotoLibraryUsageDescription -string "vlocker needs photo library access to select images for your locker items." "$PLIST"
          # Add NSFaceIDUsageDescription for biometric auth
          plutil -insert NSFaceIDUsageDescription -string "vlocker uses Face ID / Touch ID to securely unlock your locker." "$PLIST" || \
            plutil -replace NSFaceIDUsageDescription -string "vlocker uses Face ID / Touch ID to securely unlock your locker." "$PLIST"
          # Add UILaunchStoryboardName
          plutil -replace UILaunchStoryboardName -string "LaunchScreen" "$PLIST"
          echo "Info.plist configured:"
          cat "$PLIST"

      - name: Copy iOS app icon
        run: |
          ICON_SRC="public/vlocker-icon.png"
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          
          # Generate all required iOS icon sizes using native macOS sips
          # Format: "target_width target_height idiom scale"
          declare -a SIZES=(
            "20 20 iphone 1x notification"
            "20 20 iphone 2x notification"
            "20 20 iphone 3x notification"
            "29 29 iphone 1x settings"
            "29 29 iphone 2x settings"
            "29 29 iphone 3x settings"
            "40 40 iphone 2x spotlight"
            "40 40 iphone 3x spotlight"
            "60 60 iphone 2x app"
            "60 60 iphone 3x app"
            "20 20 ipad 1x notification"
            "20 20 ipad 2x notification"
            "29 29 ipad 1x settings"
            "29 29 ipad 2x settings"
            "40 40 ipad 1x spotlight"
            "40 40 ipad 2x spotlight"
            "76 76 ipad 1x app"
            "76 76 ipad 2x app"
            "83.5 83.5 ipad 2x pro-app"
            "1024 1024 ios-marketing 1x marketing"
          )
          
          IMAGES_JSON="["
          FIRST=true
          
          for spec in "${SIZES[@]}"; do
            read -r w h idiom scale label <<< "$spec"
            # Calculate pixel size
            if [ "$scale" = "1x" ]; then px="${w%.*}"; else
              if [ "$scale" = "2x" ]; then
                px=$(echo "${w%.*} * 2" | bc)
              else
                px=$(echo "${w%.*} * 3" | bc)
              fi
            fi
            filename="icon-${w%.*}-${h%.*}@${scale}.png"
            filepath="$ICONSET/$filename"
            
            # Use sips to resize
            sips -z "$px" "$px" "$ICON_SRC" --out "$filepath" > /dev/null 2>&1
            echo "Generated ${px}x${px} -> $filename"
            
            # Build JSON
            if [ "$FIRST" = true ]; then FIRST=false; else IMAGES_JSON+=","; fi
            IMAGES_JSON+="{\"size\":\"${w}x${h}\",\"idiom\":\"$idiom\",\"filename\":\"$filename\",\"scale\":\"$scale\"}"
          done
          
          IMAGES_JSON+="]"
          
          # Write Contents.json
          echo "{\"images\":$IMAGES_JSON,\"info\":{\"version\":1,\"author\":\"xcode\"}}" | python3 -m json.tool > "$ICONSET/Contents.json"
          echo "iOS icons generated successfully"
          cat "$ICONSET/Contents.json"

      - name: Build iOS Simulator App
        run: |
          cd ios/App
          # Find the first available iPhone simulator
          DEST=$(xcrun simctl list devices available | grep "iPhone" | head -1 | sed 's/.*(\([A-Z0-9-]*\)).*/\1/')
          echo "Using simulator: $DEST"
          # Build for iOS Simulator (no signing required)
          xcodebuild build \
            -scheme App \
            -destination "platform=iOS Simulator,id=$DEST" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color || true

      - name: Package Simulator App
        run: |
          # Find the built .app in DerivedData
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "App.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ios/App/build -name "App.app" -type d 2>/dev/null | head -1)
          fi
          echo "App path: $APP_PATH"
          if [ -n "$APP_PATH" ]; then
            mkdir -p ios-output
            cp -R "$APP_PATH" ios-output/vlocker.app
            # Create a zip for easier distribution
            cd ios-output
            zip -rq vlocker-ios-simulator.zip vlocker.app
            echo "Simulator app packaged successfully"
            ls -la vlocker-ios-simulator.zip
          else
            echo "App not found - listing build directories:"
            find ios/App -name "*.app" -type d 2>/dev/null || true
            find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null | head -5 || true
            exit 1
          fi

      - name: Upload iOS Simulator App
        uses: actions/upload-artifact@v4
        with:
          name: vlocker-ios-simulator
          path: ios-output/vlocker-ios-simulator.zip

  # Build for physical device distribution (requires signing secrets)
  build-ios-device:
    runs-on: macos-latest
    if: github.event.inputs.distribution == 'true' || contains(github.event.head_commit.message, '[ios-dist]')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build webapp
        run: npm run build

      - name: Add iOS platform (if not exists)
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Setup Apple Signing
        if: env.IOS_CERTIFICATE_BASE64 != ''
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          # Decode certificate
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > ios-cert.p12
          # Decode provisioning profile
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          # Install certificate
          security create-keychain -p "temp123" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "temp123" build.keychain
          security import ios-cert.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "temp123" build.keychain
          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(grep -a -A1 'UUID' profile.mobileprovision | grep string | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

      - name: Build iOS Device IPA
        run: |
          cd ios/App
          xcodebuild archive \
            -scheme App \
            -configuration Release \
            -archivePath build/vlocker.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER='' \
            | xcpretty --color || true
          
          # Export IPA
          cat > exportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string></string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          PLIST
          
          xcodebuild -exportArchive \
            -archivePath build/vlocker.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist \
            | xcpretty --color || true

      - name: Upload iOS IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vlocker-ios-device
          path: ios/App/build/ipa/*.ipa
          if-no-files-found: ignore
