name: Build Signed AAB for Play Store

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build webapp
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode signing keystore
        run: echo "" | base64 -d > android/app/vlocker-release.keystore

      - name: Configure signing and version
        run: |
          cd android/app
          sed -i 's/versionCode 1/versionCode 2/' build.gradle
          sed -i 's/versionName "1.0"/versionName "2.5.1"/' build.gradle
          cat >> build.gradle << 'EOF'

          android.signingConfigs {
              release {
                  storeFile file("vlocker-release.keystore")
                  storePassword "vlocker2024"
                  keyAlias "vlocker"
                  keyPassword "vlocker2024"
              }
          }
          android.buildTypes.release.signingConfig = android.signingConfigs.release
          EOF

      - name: Build Release AAB
        run: |
          cd android
          bash gradlew bundleRelease --no-daemon

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: vlocker-playstore-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
