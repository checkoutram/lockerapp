name: Build Signed AAB Now

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build webapp
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode and copy signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/vlocker-release.keystore
          else
            echo "No KEYSTORE_B64 secret found"
            exit 1
          fi

      - name: Configure signing and version
        run: |
          cd android/app
          # Update version
          sed -i 's/versionCode 1/versionCode 2/' build.gradle
          sed -i 's/versionName "1.0"/versionName "2.5.1"/' build.gradle
          # Add signing config
          cat >> build.gradle << 'EOF'

          // Release signing
          android.signingConfigs {
              release {
                  storeFile file("vlocker-release.keystore")
                  storePassword "vlocker2024"
                  keyAlias "vlocker"
                  keyPassword "vlocker2024"
              }
          }
          android.buildTypes.release.signingConfig = android.signingConfigs.release
          EOF
          echo "=== Version ==="
          grep -E "versionCode|versionName" build.gradle | head -2

      - name: Build Release AAB
        run: |
          cd android
          bash gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vlocker-signed-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Build Release APK (bonus)
        run: |
          cd android
          bash gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vlocker-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
