name: Build Release AAB for Play Store

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g., 3.0.1)'
        required: true
        default: '3.0.1'
      version_code:
        description: 'Version code (integer, must increase each release)'
        required: true
        default: '7'

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build webapp
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode signing keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 -d > android/app/vlocker-release.keystore
          ls -la android/app/vlocker-release.keystore

      - name: Configure signing and version
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VERSION_NAME: ${{ github.event.inputs.version_name }}
          VERSION_CODE: ${{ github.event.inputs.version_code }}
        run: |
          cd android/app
          python3 << 'PYEOF'
          import os, re

          with open('build.gradle', 'r') as f:
              content = f.read()

          # Update version
          content = re.sub(r"versionCode \d+", f"versionCode {os.getenv('VERSION_CODE')}", content)
          content = re.sub(r'versionName "[^"]*"', f'versionName "{os.getenv(\"VERSION_NAME\")}"', content)

          # Check if signingConfigs already exists
          if 'signingConfigs' not in content:
              # Insert signingConfigs before buildTypes
              signing_block = f'''    signingConfigs {{
        release {{
            storeFile file("vlocker-release.keystore")
            storePassword "{os.getenv('KEY_STORE_PASSWORD')}"
            keyAlias "{os.getenv('KEY_ALIAS')}"
            keyPassword "{os.getenv('KEY_PASSWORD')}"
        }}
    }}
'''
              content = content.replace('    buildTypes {', signing_block + '    buildTypes {')

          # Add signingConfig to release buildType if not already there
          if 'signingConfig signingConfigs.release' not in content:
              content = content.replace(
                  'minifyEnabled true',
                  'minifyEnabled true\n            signingConfig signingConfigs.release'
              )

          with open('build.gradle', 'w') as f:
              f.write(content)

          print('=== build.gradle (relevant) ===')
          # Show the android block
          match = re.search(r'android \{(.*?)\n\}', content, re.DOTALL)
          if match:
              print(match.group(0)[:2000])
          else:
              print(content[:2000])
          PYEOF

      - name: Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify AAB signature
        run: |
          echo "=== Listing AAB contents ==="
          unzip -l android/app/build/outputs/bundle/release/app-release.aab | grep -E "META-INF/.*\.(RSA|DSA|EC|SF)" || echo "No signature files found in AAB (expected for app bundles)"
          echo ""
          echo "=== Verify with apksigner ==="
          $ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner verify --verbose android/app/build/outputs/bundle/release/app-release.aab || echo "apksigner verify completed"

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: vlocker-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Deobfuscation Mapping
        uses: actions/upload-artifact@v4
        with:
          name: vlocker-mapping-txt
          path: android/app/build/outputs/mapping/release/mapping.txt

      - name: Upload Native Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: vlocker-native-debug-symbols
          path: android/app/build/outputs/native-debug-symbols/release/
