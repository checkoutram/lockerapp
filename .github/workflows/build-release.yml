name: Build Release AAB for Play Store

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g., 2.5.1)'
        required: true
        default: '2.5.1'
      version_code:
        description: 'Version code (integer, must increase each release)'
        required: true
        default: '1'

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm ci

      - name: Build webapp
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Update version in build.gradle
        run: |
          sed -i "s/versionCode .*/versionCode ${{ github.event.inputs.version_code }}/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"${{ github.event.inputs.version_name }}\"/" android/app/build.gradle
          echo "=== Version set to ${{ github.event.inputs.version_name }} (${{ github.event.inputs.version_code }}) ==="
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Decode signing keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 -d > android/app/vlocker-release.keystore

      - name: Create signing config
        run: |
          cat > android/keystore.properties << EOF
          storeFile=vlocker-release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          EOF

      - name: Update build.gradle for signing
        run: |
          cat >> android/app/build.gradle << 'EOF'

          // Release signing config
          def keystorePropertiesFile = rootProject.file("../keystore.properties")
          def keystoreProperties = new Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
              android {
                  signingConfigs {
                      release {
                          storeFile file(keystoreProperties['storeFile'])
                          storePassword keystoreProperties['storePassword']
                          keyAlias keystoreProperties['keyAlias']
                          keyPassword keystoreProperties['keyPassword']
                      }
                  }
                  buildTypes {
                      release {
                          signingConfig signingConfigs.release
                          minifyEnabled true
                          proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                      }
                  }
              }
          }
          EOF

      - name: Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: vlocker-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Build Release APK (for testing)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: vlocker-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
