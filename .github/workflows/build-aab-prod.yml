name: Build Production AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build webapp
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode signing keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 -d > android/app/vlocker-release.keystore
          ls -la android/app/vlocker-release.keystore

      - name: Configure signing and version
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd android/app
          python3 << 'PYEOF'
          import os, re

          with open('build.gradle', 'r') as f:
              content = f.read()

          # Update version
          content = content.replace('versionCode 1', 'versionCode 7')
          content = content.replace('versionName "1.0"', 'versionName "3.0.1"')

          # Insert signingConfigs before buildTypes
          signing_block = f'''    signingConfigs {{
        release {{
            storeFile file("vlocker-release.keystore")
            storePassword "{os.getenv('KEY_STORE_PASSWORD')}"
            keyAlias "{os.getenv('KEY_ALIAS')}"
            keyPassword "{os.getenv('KEY_PASSWORD')}"
        }}
    }}
'''
          content = content.replace('    buildTypes {', signing_block + '    buildTypes {')

          # Add signingConfig to release buildType
          content = content.replace(
              'minifyEnabled true\n            shrinkResources true',
              'minifyEnabled true\n            signingConfig signingConfigs.release\n            shrinkResources true'
          )

          with open('build.gradle', 'w') as f:
              f.write(content)
          print("Signing config inserted successfully")
          PYEOF
          echo "=== build.gradle (relevant) ==="
          grep -A 30 "android {" build.gradle | head -35

      - name: Build Release AAB
        run: |
          cd android
          chmod +x gradlew
          bash gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vlocker-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
